name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:lint
      - name: Fail if generated clients are stale
        run: |
          pnpm contracts:gen
          git diff --exit-code -- shared/packages

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neural-navigator/web lint
      - run: pnpm --filter @neural-navigator/web typecheck
      - run: pnpm --filter @neural-navigator/web test -- --coverage
      - run: pnpm --filter @neural-navigator/web build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: contracts
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: navigator
          POSTGRES_PASSWORD: navigator
          POSTGRES_DB: navigator_test
        options: >-
          --health-cmd "pg_isready -U navigator"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=neural_navigator --cov-report=xml

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neural-navigator/web exec playwright install --with-deps chromium
      - run: docker compose up -d postgres redis api
      - run: pnpm --filter @neural-navigator/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
