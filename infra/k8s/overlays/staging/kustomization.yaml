apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: xplainai-staging

namePrefix: staging-

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: xplainai-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: xplainai-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Ingress
      name: xplainai-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.xplainai.internal
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.xplainai.internal

configMapGenerator:
  - name: xplainai-config
    behavior: merge
    literals:
      - APP_ENV=staging
      - LOG_LEVEL=INFO
      - API_CORS_ORIGINS=https://staging.xplainai.internal
