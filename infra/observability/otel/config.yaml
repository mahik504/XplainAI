# OpenTelemetry Collector Configuration for XplainAI

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'xplainai-api'
          scrape_interval: 10s
          static_configs:
            - targets: ['api:8000']

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  batch:
    send_batch_size: 1024
    timeout: 5s
    send_batch_max_size: 2048

  resource:
    attributes:
      - key: service.namespace
        value: "xplainai"
        action: upsert

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "xplainai"
    send_timestamps: true
    metric_expiration: 180s

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: "info"
    metrics:
      address: "0.0.0.0:8888"

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [debug]
