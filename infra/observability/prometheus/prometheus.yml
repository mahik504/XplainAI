# Prometheus Scrape Configuration for XplainAI

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "xplainai-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: "production"
          service: "xplainai-api"

  - job_name: "otel-collector"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8889", "otel-collector:8888"]
        labels:
          environment: "production"
          service: "otel-collector"

  - job_name: "postgres"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          environment: "production"
          service: "postgres"

  - job_name: "redis"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          environment: "production"
          service: "redis"
