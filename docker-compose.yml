# Local development topology. Production overrides live in
# infrastructure/docker/docker-compose.prod.yml.
name: neural-navigator

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: navigator
      POSTGRES_DB: navigator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01_init_pgvector.sql:/docker-entrypoint-initdb.d/01_init_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infrastructure/observability/otel:/etc/otel:ro
    ports:
      - "4317:4317"

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: development
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./packages:/packages:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: development
    command: ["uv", "run", "arq", "neural_navigator.workers.settings.WorkerSettings"]
    env_file: .env
    volumes:
      - ./apps/api:/app
      - ./packages:/packages:ro
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: development
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
