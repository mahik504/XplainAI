apiVersion: apps/v1
kind: Deployment
metadata:
  name: xplainai-web
  labels:
    app.kubernetes.io/name: xplainai-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: xplainai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: xplainai-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xplainai-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: xplainai
    spec:
      containers:
        - name: web
          image: ghcr.io/mahik504/xplainai-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
